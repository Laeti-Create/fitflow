name: FitFlow regression checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: ['feature/**']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test isolated application functions
        run: npm test
