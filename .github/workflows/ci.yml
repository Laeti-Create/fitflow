name: FitFlow regression checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: ['feature/**']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test isolated application functions
        run: npm test
  isolated-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Firestore access rules in demo project only
        run: npm run test:rules
      - name: Browser flow with fictitious accounts
        run: npm run test:integration
